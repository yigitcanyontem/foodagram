server:
  address: 192.168.0.12
  port: 8083

spring:
  application:
    name: api-gateway
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  zipkin:
    base-url: http://localhost:9411
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:5174"
            allowedHeaders: "*"
            allowedMethods:
              - GET
              - POST
              - DELETE
              - PUT
              - PATCH
              - OPTIONS
      routes:
        - id: users
          uri: lb://USERS
          predicates:
            - Path=/api/v1/user/**
        - id: users_profile
          uri: lb://USERS
          predicates:
            - Path=/api/v1/user-profile/**
        - id: users_engagement
          uri: lb://USERS
          predicates:
            - Path=/api/v1/user-engagement/**
        - id: auth
          uri: lb://AUTH
          predicates:
            - Path=/api/v1/auth/**
        - id: notification
          uri: lb://NOTIFICATION
          predicates:
            - Path=/api/v1/notification/**
        - id: cache
          uri: lb://CACHE
          predicates:
            - Path=/api/v1/cache/**
        - id: content
          uri: lb://CONTENT
          predicates:
            - Path=/api/v1/posts/**
        - id: content
          uri: lb://CONTENT
          predicates:
            - Path=/api/v1/content-media/**
        - id: django-service
          uri: http://127.0.0.1:8000
          predicates:
            - Path=/api/v1/ai/**
          filters:
            - StripPrefix=3
        - id: comments
          uri: lb://CONTENT
          predicates:
            - Path=/api/v1/comments/**
        - id: comment-vote
          uri: lb://CONTENT
          predicates:
            - Path=/api/v1/comment-vote/**
        - id: content-feed
          uri: lb://CONTENT
          predicates:
              - Path=/api/v1/content/**
          filters:
              - RewritePath=/api/v1/content/(?<segment>.*), /api/v1/content/${segment}

management:
  tracing:
    enabled: true
    sampler:
      probability: 1.0

eureka:
  instance:
    appname: apigw
    preferIpAddress: true
    hostname: localhost
  client:
    enabled: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka
    fetch-registry: true
    register-with-eureka: true
