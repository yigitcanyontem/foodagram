server:
  port: 8088

spring:
  cloud:
    compatibility-verifier:
      enabled: false
  zipkin:
    base-url: http://localhost:9411
  rabbitmq:
    addresses: localhost:5672
  application:
    name: content
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 30MB
  data:
    mongodb:
      host: localhost
      port: 27017
      database: foodagram

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true


rabbitmq:
  exchanges:
    internal: internal.exchange
  queues:
    user: content.queue
  routing-keys:
    internal-user: internal.content.routing-key
